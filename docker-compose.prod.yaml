version: "3.9"

services:
  server:
    build:
      context: ./server
      target: production

    image: achauhan1787/ecommerce-server:v1

    container_name: ecommerce-server

    restart: unless-stopped

    env_file:
      - ./server/.env

    expose:
      - "5001"

    networks:
      - ecommerce-network

  frontend:
    build:
      context: ./frontend
      target: production

    image: achauhan1787/ecommerce-frontend:v1

    container_name: ecommerce-frontend

    restart: unless-stopped

    env_file:
      - ./frontend/.env

    expose:
      - "3000"

    depends_on:
      - server

    networks:
      - ecommerce-network

  nginx:
    build:
      context: ./nginx

    image: achauhan1787/ecommerce-nginx:v1

    container_name: ecommerce-nginx

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - frontend
      - server

    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge