services:

  server:
    build:
      context: ./server
      target: development

    container_name: exclusive-dev-server

    restart: unless-stopped

    env_file:
      - ./server/.env

    ports:
      - "5001:5001"

    volumes:
      - ./server:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      target: development

    container_name: exclusive-dev-frontend

    restart: unless-stopped

    env_file:
      - ./frontend/.env

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - server